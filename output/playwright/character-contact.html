<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>24 位历史人物 · 原创形象</title><style>*{box-sizing:border-box}body{margin:0;padding:36px;background:#f3eee3;color:#192a43;font-family:'Microsoft YaHei',sans-serif}header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px}h1{font-size:30px;margin:0}header p{font-size:14px}main{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}article{height:340px;position:relative;overflow:hidden;background:linear-gradient(var(--top),var(--bottom));color:var(--light)}article:before{content:'';position:absolute;width:180px;height:180px;border-radius:50%;top:42px;left:50%;transform:translateX(-50%);background:var(--glow);opacity:.85}img{width:100%;height:292px;object-fit:contain;position:relative}h2{position:absolute;left:18px;top:0;writing-mode:vertical-rl;font:30px SimSun,serif;letter-spacing:4px}p.motif{position:absolute;bottom:0;left:0;right:0;padding:10px 8px;margin:0;background:var(--top);text-align:center;font-size:11px}</style><header><h1>二十四种风骨，与你相逢。</h1><p>人生原型实验室 · 原创人物意象</p></header><main></main><script type="module">import{characters}from'/src/data/characters.ts';import{characterVisuals}from'/src/data/characterVisuals.ts';document.querySelector('main').innerHTML=characters.map(c=>{const v=characterVisuals[c.id];return `<article style="--top:${v.top};--bottom:${v.bottom};--light:${v.light};--glow:${v.glow}"><img src="${c.image}" alt="${c.name}"><h2>${c.name}</h2><p class="motif">${v.motif}</p></article>`}).join('');</script></html>
